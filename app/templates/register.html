{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 60px auto; padding: 0 20px;">
    <div class="panel">
        <h1 class="panel-heading">Create Account</h1>

        {% if error %}
        <div style="background-color: #fee; border: 1px solid #fcc; color: #c33; padding: 12px; margin-bottom: 20px; border-radius: 4px;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="field">
                <label class="field-label" for="email">Email</label>
                <input class="input" type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="field">
                <label class="field-label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password" placeholder="Choose a password" required>
            </div>

            <div class="panel-footer">
                <a class="btn btn-secondary" href="{{ url_for('main.index') }}">Cancel</a>
                <button class="btn btn-primary" type="submit">Register</button>
            </div>

        </form>

        <p style="text-align: center; margin-top: 20px;">
            Already have an account? <a href="{{ url_for('main.login') }}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
