<!DOCTYPE html>
<html>
    <head>
        <title>Task Manager</title>
    </head>
    <body>
        <h1>Tasks</h1>
        {% if tasks %} 
        {# if tasks variable from routes.py (which runs Task.query.all()) exists, then run the following#}
            <ul>
                {% for task in tasks %}
                    <li>{{ task.title}}</li>

                    <a href="{{ url_for('main.edit_task', task_id=task.id) }}">Edit</a>
                    <form method="POST" action="{{ url_for('main.delete_task', task_id=task.id) }}" style="display:inline">
                        <button type="submit">Delete</button>
                    </form>
                {% endfor %}

            </ul>
        {% else %}
            <p>No tasks yet.</p>
        {% endif %}

        <a href="{{ url_for('main.create_task') }}">Add Task</a>
    </body>
</html>
