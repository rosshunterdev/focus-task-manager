<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}FOCUS{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>

        <div class="page">
            <div class="wordmark">FOCUS</div>
            <div class="navrow">
                <div class="navlinks">

                    <a class="navlink {% if request.endpoint == 'main.dashboard' %}is-active{% endif %}" href="{{ url_for('main.dashboard') }}">Dashboard</a>

                    <a class="navlink {% if request.endpoint == 'main.index' %}is-active{% endif %}" href="{{ url_for('main.index') }}">All Tasks</a>

                    <span class="navlink is-disabled">Calendar</span>

                </div>
                {% if current_user.is_authenticated %}
                <div class="nav-actions">
                    <a class="btn btn-primary"
                    href="{{ url_for('main.create_task') }}">
                    Add Task
                </a>
                    <div class="avatar">{{ current_user.email[0] |upper }}</div>
                

                <form method="POST" action="{{ url_for('main.logout') }}">
                    <button class="btn btn-secondary" type="submit">Log Out</button>
                </form>

                </div>

                {% endif %}

            </div>
            <div class="nav-rule"></div>

            {% block content %}{% endblock %}
        </div>

    </body>
</html>
